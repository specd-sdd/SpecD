- op: added
  position:
    parent:
      type: section
      matches: '^Requirements$'
  content: |
    ### Requirement: Suggest subcommand

    `specd specs deps suggest [<spec-id>] [--spec <id>...] [--all] [--workspace <name>] [--apply] [--create-change] [--rebuild-cache]` MUST invoke `SuggestSpecDependencies` in `@specd/sdk`.

    When `--apply` is passed, the command MUST delegate additive mutation to the SDK use case, which merges new discovered dependency IDs into `spec-lock.json` via `UpdatePersistedSpecDeps`.

    When `--apply` is passed and post-apply validation detects invalid specs:
    - If `--create-change` is passed, the SDK use case MUST create a single alignment change gathering ALL invalid specs and write `.specd-exploration.md`.
    - If `--create-change` is NOT passed, the CLI MUST log a suggested alignment command for the user to run manually.
    - Machine-readable formats (`json` and `toon`) MUST NEVER prompt or block stdin.


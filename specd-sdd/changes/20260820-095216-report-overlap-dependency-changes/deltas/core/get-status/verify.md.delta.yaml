- op: modified
  description: 'Verify GetStatus projects dependency changes and legacy fallback'
  selector:
    type: section
    matches: 'Requirement: Returns lifecycle context'
  content: |
    #### Scenario: Available transitions require persisted complete or skipped state

    - **GIVEN** a change in `designing` state
    - **AND** an artifact required by `ready` is `pending-review`
    - **WHEN** `execute()` is called
    - **THEN** `lifecycle.availableTransitions` does not include `ready`

    #### Scenario: Next artifact resolves from persisted state

    - **GIVEN** a change with `proposal` in `complete`, `specs` in `complete`, and `verify` in `missing`
    - **WHEN** `execute()` is called
    - **THEN** `lifecycle.nextArtifact` is `'verify'`

    #### Scenario: Skipped artifacts still satisfy lifecycle gating

    - **GIVEN** a change whose required optional artifact is `skipped`
    - **WHEN** `execute()` is called
    - **THEN** that artifact does not block `availableTransitions`

    #### Scenario: Structured overlap detail includes dependency changes

    - **GIVEN** a change in `designing` with files in `pending-review`
    - **AND** one unhandled overlap event contains structured archived identity, overlapping specs, and added and removed dependencies
    - **WHEN** `execute()` is called
    - **THEN** `review.required` is `true` and `review.reason` is `spec-overlap-conflict`
    - **AND** `review.overlapDetail` contains the archived change name, all overlapping spec IDs, and the exact `dependencyChanges`

    #### Scenario: Multiple unhandled overlap details remain newest-first

    - **GIVEN** unhandled structured overlap events from archived changes `alpha` and then `beta`
    - **AND** each event contains different dependency changes
    - **WHEN** `execute()` is called
    - **THEN** `review.overlapDetail` has two entries ordered `beta`, then `alpha`
    - **AND** each entry retains only its own dependency changes

    #### Scenario: Legacy overlap event exposes empty dependency changes

    - **GIVEN** an unhandled legacy overlap event lacks structured detail but has a parseable message
    - **WHEN** `execute()` is called
    - **THEN** `review.overlapDetail` contains the parsed archived change name and spec IDs
    - **AND** its `dependencyChanges` is empty

    #### Scenario: Overlap scan stops at forward transition boundary

    - **GIVEN** a change with history: `invalidated(spec-overlap-conflict, alpha)`, `transitioned(designing)`, `transitioned(ready)`, `invalidated(spec-overlap-conflict, beta)`, `transitioned(designing)`
    - **AND** files are in `pending-review`
    - **WHEN** `execute()` is called
    - **THEN** `review.overlapDetail` has only one entry referencing `beta`
    - **AND** the `alpha` invalidation and its dependency changes are excluded

    #### Scenario: Artifact drift takes priority over overlap

    - **GIVEN** a change has a file in `drifted-pending-review`
    - **AND** unhandled structured overlap invalidations exist
    - **WHEN** `execute()` is called
    - **THEN** `review.reason` is `artifact-drift`
    - **AND** `review.overlapDetail` is empty

    #### Scenario: Non-overlap review has empty overlap detail

    - **GIVEN** files are in `pending-review`
    - **AND** the latest invalidation cause is `artifact-review-required`
    - **WHEN** `execute()` is called
    - **THEN** `review.overlapDetail` is empty

    #### Scenario: No invalidation event produces empty overlap detail

    - **GIVEN** a change has no `invalidated` events in history
    - **WHEN** `execute()` is called
    - **THEN** `review.overlapDetail` is empty

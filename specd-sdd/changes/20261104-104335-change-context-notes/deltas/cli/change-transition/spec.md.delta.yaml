- op: added
  position:
    parent:
      type: section
      matches: '^Requirements$'
  content: |
    ### Requirement: Reason sources and optional note policy

    Accept mutually exclusive --reason and --reason-input <path|-> as UTF-8 plain-text reason sources. --note additionally requests a current note using that text; it requires non-blank reason. Without --note, store only transitioned.reason. Removal flags require --note: repeated --note-remove parsed by Core and simple --note-remove-on-enter/--note-remove-on-leave shortcuts contribute anyOf alternatives. Reuse shared file/stdin I/O; reject conflicts/read errors before invoking a mutating use case. Do not implement grammar or policy equality in CLI. Failed/no-op transitions SHALL neither create requested notes nor clean existing notes. Update all relevant help/docs and maintain existing check progress behavior.


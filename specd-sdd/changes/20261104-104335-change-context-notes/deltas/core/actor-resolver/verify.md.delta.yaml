- op: modified
  selector:
    type: section
    matches: '^Requirement: Privacy wrapping$'
  content: |
    Scenarios:

    #### Scenario: Privacy wrapping applied at kernel level

    - **GIVEN** `privacy.mode` is `mask`
    - **WHEN** the kernel is constructed with a privacy config
    - **THEN** the actor resolver exposed by `kernel-internals` is a `PrivacyActorResolver` wrapping the detected base resolver

    #### Scenario: IDs exist without privacy

    - **GIVEN** the same raw actor is composed without privacy and in every privacy mode
    - **WHEN** resolution succeeds
    - **THEN** every output preserves the same raw-derived ID and SYSTEM_ACTOR is finalized without external identity lookup

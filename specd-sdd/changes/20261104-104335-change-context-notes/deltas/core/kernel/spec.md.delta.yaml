- op: added
  position:
    parent:
      type: section
      matches: '^Requirements$'
  content: |
    ### Requirement: Note use case entries and identity finalization

    Kernel.changes SHALL expose addNote, removeNote, listNotes and getNote as their concrete use case types, with standard public factories/resolver wiring. Shared repository/actor dependencies SHALL be reused. Actor finalization SHALL supply versioned pre-privacy IDs with or without privacy configured, including SYSTEM_ACTOR; narrowing actor copies MUST preserve IDs.


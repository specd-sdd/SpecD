- op: modified
  selector:
    type: section
    matches: '^Requirement: identity returns the current actor$'
  content: |
    Scenarios:

    #### Scenario: Successful identity resolution

    - **GIVEN** an identity source with configured name and email
    - **WHEN** `identity()` resolves
    - **THEN** it returns an object with non-empty `name`
    - **AND** the `email` is non-empty for providers with email sources, or empty for providers without
    - **AND** it MAY include `provider`, `providerId`, and `metadata`

    #### Scenario: Canonical actor input order

    - **GIVEN** metadata and top-level keys are reordered and absent fields replaced with undefined
    - **WHEN** resolution finalizes IDs and one input changes metadata
    - **THEN** equivalent representations have identical v1 IDs, changed metadata changes ID, supported empty-email input remains valid

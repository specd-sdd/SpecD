- op: modified
  selector:
    type: section
    matches: '^Requirement: Input contract$'
  content: |
    The Use Case MUST accept `TransitionChangeInput` containing:

    - `name`: Change identifier (`string`).
    - `to`: Target lifecycle state enum or `'next'`.
    - `skipChecks`: Optional array of check IDs to bypass (`readonly string[]`).
    - `skipHookPhases`: Optional array of hook phases to skip (`readonly HookPhase[]`).
    - `onProgress`: Optional progress callback for streaming telemetry.

    The Use Case MUST NOT accept ad-hoc check bypass booleans (`allowOutOfScope`, `allowOverlap`). Check bypasses SHALL be supplied uniformly through `skipChecks`.

    Input additionally accepts reason?: string and note?: { autoRemove?: NoteAutoRemoval }. note requires a non-blank reason and reuses that text; no policy means no automatic removal. Validate the complete input at runtime (types, unknown fields, variants and cross-field constraints) before actor resolution, refresh, reconciliation, hooks or any effects. Invalid input SHALL produce typed errors and zero effects.

- op: added
  position:
    parent:
      type: section
      matches: '^Requirements$'
  content: |
    ### Requirement: Atomic optional reason and current note

    Record reason in the transitioned event independently of optional note creation. Only after a successful effective transition within the final serialized mutation, clean existing notes and add/reuse the requested note. Failed predicate/hook/no-op/persistence paths SHALL not create requested notes or clean existing notes. Preserve any previously committed independent recovery and its note when the requested hop fails. Do not call AddChangeNote as a separately persisted follow-up operation. Reject reason/note on a neutral self-entry.


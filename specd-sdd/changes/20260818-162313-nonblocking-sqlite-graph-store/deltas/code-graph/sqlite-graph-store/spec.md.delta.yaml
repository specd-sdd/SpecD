- op: modified
  selector:
    type: section
    matches: 'Requirement: SQLite-backed implementation'
  content: |
    `SQLiteGraphStore` SHALL implement the abstract `GraphStore` contract using
    `better-sqlite3` as its underlying storage engine, executing all synchronous
    SQLite operations within a dedicated, persistent Node.js Worker Thread
    (`node:worker_threads`) owned by the store instance.

    Synchronous SQLite queries, mutations, transactions, schema initialization,
    and FTS operations MUST NOT execute on the host event-loop thread. The caller
    interacts with the store exclusively through the asynchronous `GraphStore`
    interface, receiving genuine non-blocking event-loop behavior.

- op: added
  position:
    parent:
      type: section
      matches: 'Requirements'
    after:
      type: section
      matches: 'Requirement: SQLite-backed implementation'
  content: |
    ### Requirement: Worker-backed non-blocking execution

    `SQLiteGraphStore` SHALL manage worker thread isolation and communication
    according to the following operational invariants:

    1. **Persistent Worker Lifecycle**: Each open store instance owns exactly one
       persistent worker thread. Workers SHALL NOT be spawned per operation or
       pooled. `open()` starts and initializes the worker, and `close()` terminates
       it cleanly and idempotently. Concurrent calls to `open()` or `close()` MUST
       share the same in-flight initialization or shutdown Promise.
    2. **Worker Ownership**: The worker thread owns the `better-sqlite3` database
       connection, prepared statements cache, active transactions, and backend-owned
       filesystem operations (such as database file creation and cleanup). Database
       handles and prepared statements MUST NOT cross the worker boundary.
    3. **Strongly-Typed Protocol**: Host and worker communicate via structured-cloneable
       messages with monotonic correlation IDs. The protocol MUST use strongly-typed
       DTOs mapping operation to payload and result. Native objects, functions, and
       class instances with prototypes MUST NOT be transferred across the boundary.
    4. **Worker FIFO Serialization**: The worker MUST process incoming messages through
       an explicit serial execution queue, ensuring that asynchronous operations (such
       as `open()` and `recreate()`) and subsequent queries execute in strict FIFO order
       without interleaving.
    5. **Bounded Outstanding Requests**: The host client MUST enforce a strictly
       validated limit on outstanding pending requests (`maxPendingOperations >= 1`,
       default: 256). When the limit is exceeded, new requests MUST reject immediately
       with `StoreOverloadError` without disturbing existing queued requests.
    6. **Graceful Shutdown & Drain**: Calling `close()` MUST transition the client to
       `closing` and immediately reject new operations with `StoreNotOpenError`.
       `drainTimeoutMs` (default: 5 000 ms) is a deadline for graceful shutdown,
       covering `await openPromise`, the drain phase, and the `close` RPC ACK via a
       unref'd `withDeadline` helper. If any phase exhausts the deadline, remaining
       pending requests MUST be rejected with `StoreWorkerError`, and forced worker
       termination (`worker.terminate()`) MUST be initiated. A worker executing native
       code provides no mathematical guarantee of terminating within a fixed wall-clock
       bound, so `close()` SHALL NOT advertise a hard upper bound on its total duration;
       instead it MUST wait for the forced termination to conclude. The `closePromise`
       sentinel MUST be cleared in an outer `finally` block wrapping the entire shutdown body.
    7. **Serializable Runtime Descriptor**: The worker receives SQLite runtime
       configuration via a serializable descriptor (`SqliteRuntimeDescriptor`),
       enabling dynamic loading of custom SQLite native bindings. `workerPath` is strictly
       an internal testing option and SHALL NOT be exposed on public options interfaces.
    8. **Fault Isolation & Manual Recovery**: If the worker thread crashes or exits
       unexpectedly, the store transitions to a `faulted` state, rejecting outstanding
       operations with `StoreWorkerError`. Manual recovery is achieved by calling `close()`
       followed by `open()`. An unexpected exit during `opening` transitions to `faulted`
       unless `close()` already owns the lifecycle (in which case final state is `closed`).
    9. **Concurrent open()/close() Race**: If `close()` is called while `open()` is
       still in-flight, `close()` MUST wait for `openPromise` within the shared deadline.
       `open()` MUST NOT transition state to `'open'` once `close()` has set state to `'closing'`.
    10. **Chunked Worker-Side Bulk Staging & Lifecycle Session Token**: Bulk index operations
        MUST stage entity chunks progressively to the worker thread via RPCs (`stageBulkFiles`,
        `stageBulkSymbols`, etc.) under a worker-side session (`sessionId`). Only
        `beginBulkIndexSession` MAY create a session; staging, commit, and rollback against a
        missing or already finalized session MUST reject rather than resurrect it. The host
        session SHALL enforce an `active`/`committing`/`rolling-back`/`finished` state machine so
        writes, removals, and duplicate commits or rollbacks are rejected while a commit or
        rollback is in flight. Reference-facts chunks staged in the same session MUST be merged
        (not replaced) so earlier chunks survive later writes. The final visible mutation MUST
        commit atomically within a single SQLite worker transaction. Sessions MUST be bound to a
        host-side `lifecycleGeneration` token and invalidated deterministically on store close,
        worker crash, or recreation.
    11. **Isolated Observational Progress Callbacks**: Progress callback notifications (`onProgress`)
        MUST be strictly observational. Any exception thrown by a progress callback handler MUST be
        caught and isolated silently without failing the active operation or aborting transactions.
    12. **Non-Blocking Closed Store Maintenance**: When `recreate()` is called on a closed store,
        directory cleanup (`rm`) and generation sidecar rotation (`rotateStorageGenerationAsync`)
        MUST execute asynchronously using non-blocking host I/O (`node:fs/promises`).

- op: modified
  selector:
    type: section
    matches: 'Requirement: Transactional mutation model'
  content: |
    `SQLiteGraphStore` SHALL use SQLite transactions executing entirely within the
    worker thread to preserve the atomic mutation semantics required by the
    abstract `GraphStore` contract.

    Transactions MUST NOT span multiple host/worker IPC round-trips. Each atomic
    mutation (including `upsertFile()`, `removeFile()`, `upsertSpec()`,
    `removeSpec()`, and bulk index commit) MUST be dispatched and executed as a
    single, self-contained worker operation.

    At minimum:

    - `upsertFile()` MUST replace file-local graph state atomically
    - `removeFile()` MUST remove file-local graph state atomically
    - `upsertSpec()` MUST replace spec-local graph state atomically
    - `removeSpec()` MUST remove spec-local graph state atomically
    - bulk indexing operations MUST commit all-or-nothing backend state for the batch they
      claim to have persisted

    If a transaction fails, the backend MUST leave previously committed graph state intact.

- op: modified
  selector:
    type: section
    matches: 'Requirement: Bulk indexing support'
  content: |
    `SQLiteGraphStore` SHALL support efficient bulk indexing for large repositories.

    Bulk index data MUST be staged to the worker in bounded chunks (not as one giant
    structured-clone payload) and committed atomically as a single worker-side SQLite
    transaction. The `bulkLoad()` convenience path SHALL internally use the chunked
    `IndexWriteSession` staging flow and MUST NOT transfer a complete repository graph
    across the worker boundary in a single IPC message.

    During bulk commit, the worker MUST emit serializable progress events (covering
    `cleanup`, `files`, `documents`, `symbols`, `specs`, `reference-facts`,
    `observations`, `relations`, and `search-indexes`) across the worker boundary,
    which the host forwards to any registered `onProgress` callback.

    The adapter MAY use batching, prepared statements, temporary tables, or other
    SQLite-appropriate techniques to keep large indexing runs stable, provided the
    observable `GraphStore` contract and bulk atomicity are preserved.

    If the implementation materializes backend-owned scratch artifacts outside the
    primary database file, those artifacts MUST be scoped to `{configPath}/tmp` and
    cleaned up after successful completion.

- op: modified
  selector:
    type: section
    matches: 'Requirement: Reference schema upgrade'
  content: |
    SQLite SHALL persist the enriched logical-symbol, declaration, member, symbol-space, binding, provenance, coverage, complete construct range, and declared-name selection range fields required by `GraphStore`. Structured workspace, surface, name, symbol-space, owner, member-form, and exported-name columns SHALL have indexes supporting semantic search and selector resolution without parsing or substring-ranking serialized canonical ids. Canonical ids remain unique external identities. Backend-local integer row keys MAY be used for physical joins when they do not change provider-visible ids.

    SQLite SHALL maintain a dedicated source-file content FTS index using substring-capable trigram tokenization. Candidate queries SHALL use the shared complete/raw/expanded query plan, honor filters before candidate limits, and return indexed content or precise evidence for Code Graph verification. Queries shorter than three characters SHALL use a bounded indexed/SQL fallback defined by the shared Store contract rather than returning every file for application-layer scanning.

    Batched reverse coverage lookup SHALL use set-based predicates over deduplicated file paths and symbol ids and deterministic ordering.

    The backend SHALL track a reference schema version; the current reference schema version is `9`. A schema-affecting change SHALL increment the schema version exactly once relative to the version current when that change's implementation begins. An incompatible database MUST reject ordinary reads. `graph index` SHALL rebuild it destructively, rotate `storage.epoch`, and complete FTS rebuild before marking it ready.

    SQLite SHALL persist indexed-input observations, workspace/global latches, VCS-scope evidence, and compact unchanged-file facts required by incremental hydration. One indexing run SHALL use one database transaction, set-based relation endpoint validation, bounded prepared/bulk inserts, one commit, and one rebuild of all semantic and content FTS indexes. Chunk appends MUST NOT rebuild FTS independently.

- op: modified
  description: 'Project nextAction.command in change invalidate from Core structured intents via CLI guidance presenter'
  selector:
    type: section
    matches: 'Requirement: Reporting'
  content: |
    Success output SHALL report the recorded `reason`, both effective policy dimensions, affected artifact/file targets, approval or verification status changes, canonical blockers, next action, and any automatic return committed by the reconciler in text, JSON, and TOON. The CLI SHALL project `nextAction.command` from Core's host-neutral `nextAction.intent` (and optional `action`) via the centralized CLI guidance presenter. JSON and TOON SHALL expose `reason` as a named field rather than only embedding it in prose. When `--force` is required because valid consent would be revoked, the refusal SHALL render the exact affected gates and Core-selected recovery targets. The CLI MUST project blockers through the same CLI blocker projection as status (text lines with the gerund `label` when present; JSON and TOON with `label`, `checkId`, and `bypassFlag`, and no raw `isSkippable`). The refusal MUST NOT print a hard-coded `Re-run with --force.` sentence in the command; the only `--force` recovery text is the hint resolved from `INVALIDATE_REQUIRES_FORCE` by the centralized hint-resolution helper, so it appears exactly once.

    Output MUST NOT claim that `preserve` permits forward progress with drift. It means only that artifact drift itself did not move the current lifecycle state.

- op: removed
  description: 'Remove obsolete scenario group for global specs'
  selector:
    type: section
    matches: '^Requirement: Global specs for cross-cutting constraints$'

- op: removed
  description: 'Remove obsolete scenario group for package specs'
  selector:
    type: section
    matches: '^Requirement: Package specs for package-internal concerns$'

- op: removed
  description: 'Remove obsolete scenario group for spec file naming'
  selector:
    type: section
    matches: '^Requirement: Spec file naming$'

- op: removed
  description: 'Remove obsolete scenario group for verify.md structure'
  selector:
    type: section
    matches: '^Requirement: verify\.md structure$'

- op: removed
  description: 'Remove obsolete scenario group for spec.md structure'
  selector:
    type: section
    matches: '^Requirement: spec\.md structure$'

- op: removed
  description: 'Remove obsolete scenario group for Spec Dependencies section'
  selector:
    type: section
    matches: '^Requirement: Spec Dependencies section$'

- op: added
  description: 'Add scenario group for superseded requirement'
  position:
    parent:
      type: section
      matches: '^Requirements$'
  content: |
    ### Requirement: Superseded by schema-std

    #### Scenario: Spec layout enforcement delegated to active schema

    - **WHEN** spec artifacts or directory layouts are validated
    - **THEN** validation rules defined by the active schema (@specd/schema-std) are evaluated
    - **AND** this spec enforces no separate runtime constraints

- op: modified
  description: Document resolver-owned VCS auto-detect
  selector:
    type: section
    matches: 'Requirement: Project-level VCS and actor adapters must use auto-detect'
  content: |
    `createKernel` obtains project VCS and actor adapters from the shared `CompositionResolver`. It MUST NOT define `createKernelInternals`, and it MUST NOT construct `GitVcsAdapter` or `GitActorResolver`.

    `CompositionResolver.getVcsAdapter()` MUST call `createVcsAdapter(config.projectRoot, registry.vcsProviders)` and reuse that promise.

    When `config.actorProvider` is omitted, `CompositionResolver.getActorResolver()` MUST use `createLazyVcsActorResolver(() => getVcsAdapter())`. When `config.privacy` is set, that resolver MUST be wrapped in `PrivacyActorResolver`.

    Standalone use-case factories in `composition/use-cases/` MUST NOT construct `GitActorResolver`. They MUST obtain the actor through the composition resolver.

    This keeps git, Mercurial, Subversion, and non-VCS projects working without a caller-visible kernel helper.


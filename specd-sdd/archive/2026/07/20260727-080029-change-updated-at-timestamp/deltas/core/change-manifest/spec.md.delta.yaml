- op: added
  description: Document optional updatedAt field on change manifests
  position:
    parent:
      type: section
      matches: 'Requirement: Manifest structure'
    after:
      type: paragraph
      contains: 'Field definitions:'
  content: |
    - `updatedAt` — optional ISO 8601 timestamp string representing the timestamp when the change was last updated.
